name: Visual Baseline

# 기준 이미지 생성·갱신의 유일한 경로. 로컬(macOS)에서 --update-snapshots를 돌리면
# 폰트 렌더링 차이로 CI가 영구히 붉어진다 — 테스트 쪽에도 하드 가드가 있다.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate tokens
        run: pnpm generate

      - name: Build packages
        run: pnpm build

      - name: Read Playwright version
        id: playwright
        run: |
          echo "VERSION=$(node -p "require('./apps/visual-regression/package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.VERSION }}

      - name: Install Playwright chromium
        run: pnpm --filter @dg-design/visual-regression exec playwright install --with-deps chromium

      - name: Update baselines
        run: pnpm --filter @dg-design/visual-regression exec playwright test --update-snapshots

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/visual-regression/tests/__screenshots__
          if git diff --staged --quiet; then
            echo "기준 이미지 변경 없음"
            exit 0
          fi
          git commit -m "chore(visual-regression): 기준 이미지 갱신"
          git push
