name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate tokens
        run: pnpm generate

      - name: Build packages
        run: pnpm build

      - name: Check React subpath entries
        run: pnpm --filter @dg-design/react run check:subpaths

      - name: Test
        run: pnpm --filter @dg-design/react run test

      # storybook typecheck가 react의 dist/index.d.ts를 참조하므로 build 뒤에 돈다
      - name: Typecheck
        run: pnpm typecheck

      - name: Check React package quality
        run: pnpm --filter @dg-design/react exec publint

      # storybook-static은 앞선 build 단계(pnpm -r run build)의 산출물을 그대로 쓴다
      - name: Read Playwright version
        id: playwright
        run: |
          echo "VERSION=$(node -p "require('./apps/visual-regression/package.json').devDependencies['@playwright/test']")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.VERSION }}

      - name: Install Playwright chromium
        run: pnpm --filter @dg-design/visual-regression exec playwright install --with-deps chromium

      - name: Visual regression
        run: pnpm vr

      - name: Upload visual diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: |
            apps/visual-regression/test-results/
            apps/visual-regression/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
